services:
  - type: web
    name: collabsphere-server
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: collabsphere-db
          property: connectionString
      - key: PORT
        value: 8080
      - key: UPLOAD_DIR
        value: /app/local_files_upload
      - key: JWT_SECRET
        generateValue: true
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER
        value: collabsphere.studio@gmail.com

databases:
  - name: collabsphere-db
    databaseName: Collabsphere
    user: collabsphere_user
    plan: free
    region: oregon
