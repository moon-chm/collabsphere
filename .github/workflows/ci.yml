name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-server:
    name: Build Ktor Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: ./collabsphere_server

      - name: Build and Test Server
        run: ./gradlew build
        working-directory: ./collabsphere_server

  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: ./collabsphere_app

      - name: Build Android App (Debug)
        run: ./gradlew assembleDebug
        working-directory: ./collabsphere_app

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest
        working-directory: ./collabsphere_app

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: collabsphere_app/app/build/outputs/apk/debug/app-debug.apk
