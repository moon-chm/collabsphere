name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server-tests:
    name: Server unit and PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: collabsphere_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d collabsphere_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/collabsphere_test?sslmode=disable
      COLLABSPHERE_ALLOW_TEST_DB: YES
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Grant execute permission for gradlew
        working-directory: collabsphere_server
        run: chmod +x gradlew
      - name: Run isolated server tests and disposable PostgreSQL integration tests
        working-directory: collabsphere_server
        run: ./gradlew checkWithIntegration --no-daemon

  android-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Grant execute permission for gradlew
        working-directory: collabsphere_app
        run: chmod +x gradlew
      - name: Run Android unit tests
        working-directory: collabsphere_app
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  android-ui-tests:
    name: Android Compose UI tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Grant execute permission for gradlew
        working-directory: collabsphere_app
        run: chmod +x gradlew
      - name: Run Compose UI smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          working-directory: collabsphere_app
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon
